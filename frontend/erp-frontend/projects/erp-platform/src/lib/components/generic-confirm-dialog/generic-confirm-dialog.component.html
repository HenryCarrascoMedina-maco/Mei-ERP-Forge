<h2 mat-dialog-title>
  @if (data.icon) {
    <mat-icon [color]="color">{{ data.icon }}</mat-icon>
  }
  {{ data.title ?? 'Confirm' }}
</h2>

<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">{{ data.cancelText ?? 'Cancel' }}</button>
  <button mat-flat-button [color]="color" (click)="confirm()">
    {{ data.confirmText ?? 'Confirm' }}
  </button>
</mat-dialog-actions>
