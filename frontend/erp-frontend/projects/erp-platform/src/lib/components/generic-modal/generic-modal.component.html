<div class="modal modal--{{ size }}">
  <div class="modal__header" mat-dialog-title>
    <h2 class="modal__title">{{ title }}</h2>
    @if (showClose) {
      <button mat-icon-button aria-label="Close" (click)="closed.emit()">
        <mat-icon>close</mat-icon>
      </button>
    }
  </div>

  <mat-dialog-content class="modal__content">
    <ng-content></ng-content>
  </mat-dialog-content>

  @if (showFooter) {
    <mat-dialog-actions align="end" class="modal__footer">
      <ng-content select="[modal-footer]"></ng-content>
    </mat-dialog-actions>
  }
</div>
