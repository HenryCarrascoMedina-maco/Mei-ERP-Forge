name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        working-directory: backend/ErpBackend
        run: dotnet build ErpBackend.slnx -c Release

      - name: Test
        working-directory: backend/ErpBackend
        run: dotnet test ErpBackend.slnx -c Release --no-build --verbosity normal

  frontend:
    name: Frontend — build library & app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/erp-frontend/package-lock.json

      - name: Install
        working-directory: frontend/erp-frontend
        run: npm ci

      - name: Build library (@erp-platform/core)
        working-directory: frontend/erp-frontend
        run: npm run ng -- build erp-platform

      - name: Build app
        working-directory: frontend/erp-frontend
        run: npm run build
